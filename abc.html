<!Doctype html>
<html>
    <body>
       <script>
        var state=0;
        function myfunction1()
{         
           if (state==0)
            {
            document.getElementById('btn').textContent="Off";
            document.getElementById('myid').src="fanon.gif";
            state=1;
            }
            else if(state==1)
            {
            document.getElementById('btn').textContent="On";
            document.getElementById('myid').src="fanoff.jpg";
            state=0;
            }
}
       </script>
       <img id="myid" src="fanoff.jpg" width="269" height="220">
 
       <br>
       <button type="button" id="btn" onclick="myfunction1()" style="width:50px;height:50px";>on</button>
       </br>
    </body>
</html>

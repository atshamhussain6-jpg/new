<body>

<script>
 var state=0;
function laraib() 
{ 
  
       if (state==0)

        document.getElementById('myid2').src="pic_bulbon.gif";

        document.getElementById('myid2').src="pic_bulboff.gif";
        state=0;
      }
}
</script>
